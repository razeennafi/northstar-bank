# File: nginx.conf
# Description: Serves compiled assets and proxies restricted backend routes.
# Project version: 0.1.0

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_hide_header X-Content-Type-Options;

    # Keep API requests on the frontend origin so the browser can use its session cookie.
    location ^~ /api/v1/ {
        proxy_pass $backend$request_uri;
    }

    # Give streamed statements a longer timeout and pass them through as the server writes them.
    location = /api/v1/statements/download {
        proxy_pass $backend$request_uri;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }

    location = /actuator/health/readiness {
        # Docker DNS resolves service names. Runtime lookup handles backend recreation.
        proxy_pass $backend$request_uri;
        proxy_read_timeout 5s;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
