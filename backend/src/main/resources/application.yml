# Portfolio author: Razeen Abdun Nafi
# Date: 2026-11-22
# File: application.yml
# Description: Configures datasource, session, readiness, and OpenAPI settings.
# Project version: 0.1.0

spring:
  application:
    name: northstar-banking
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/northstar}
    username: ${SPRING_DATASOURCE_USERNAME:northstar}
    password: ${SPRING_DATASOURCE_PASSWORD}
    # Hikari reuses a bounded pool of database connections across request threads.
    hikari:
      maximum-pool-size: 8
      connection-timeout: 2000
  jpa:
    # Flyway owns schema changes. Services control when persistence access occurs.
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: NORTHSTAR_SESSION
        http-only: true
        secure: ${BANK_SECURE_COOKIES:true}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Readiness checks database connectivity while keeping component details private.
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

bank:
  demo-funding-enabled: ${BANK_DEMO_FUNDING_ENABLED:false}

springdoc:
  api-docs:
    path: /api/v1/openapi
  paths-to-match: /api/v1/**
